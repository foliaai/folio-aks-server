# Agentic knowledge system configuration file

# ==================== Kafka Topic 命名规范 ====================
# 格式: {业务模块}.{处理阶段}.{事件类型}
# 示例: knowledge_base.index.start, db_write.embedding.start
# 注意: 使用点号分隔（Kafka 不允许使用冒号）

# ==================== 数据库配置 ====================

# Milvus 向量数据库配置
[milvus]
# ========== 模式选择 ==========
# 模式: "server" (标准版，连接远程服务) 或 "lite" (本地版，用于开发测试)
mode = "server"

# ========== Server版配置（生产环境） ==========
# host 由环境变量 MILVUS_HOST 提供（dev: localhost / prod: milvus-standalone）
port = 19530
# 数据库名称由环境变量 MILVUS_DATABASE 提供（dev: dev_default / prod: default）
# 连接超时时间（秒）
timeout = 30
# 连接别名前缀
alias_prefix = "aks_milvus"

# ========== Lite版配置（开发/测试环境） ==========
# 本地数据库文件路径
lite_db_path = "./data/milvus.db"
# Lite版最大并发连接数
lite_max_connections = 10

# ========== 公共配置 ==========
# 默认集合名称
default_collection = "knowledge_vectors"
# 向量维度
vector_dim = 1024
# 索引类型: IVF_FLAT, IVF_SQ8, IVF_PQ, HNSW
index_type = "HNSW"
# 距离度量: L2, IP, COSINE
metric_type = "COSINE"
# 索引参数
index_params = { M = 16, efConstruction = 256 }
# 搜索参数
search_params = { ef = 128 }

# MongoDB 文档数据库配置
[mongodb]
# host 由环境变量 MONGODB_HOST 提供（dev: localhost / prod: mongodb）
port = 27017
# 数据库名称由环境变量 MONGODB_DATABASE 提供（dev: dev_default / prod: default）
# 连接超时时间（毫秒）
connect_timeout_ms = 5000
server_selection_timeout_ms = 5000
# 连接池配置
max_pool_size = 50
min_pool_size = 10

# MySQL 关系数据库配置
[mysql]
# ========== 模式选择 ==========
# 模式: "mysql" (MySQL Server) 或 "sqlite" (SQLite本地数据库)
mode = "mysql"

# ========== MySQL Server配置 ==========
# host 由环境变量 MYSQL_HOST 提供（dev: localhost / prod: services_mysql）
port = 3306
# 数据库名称由环境变量 MYSQL_DATABASE 提供（dev: dev_default / prod: default）
# 字符集
charset = "utf8mb4"
# 连接池配置
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 3600
# 是否显示SQL语句（true 时每条 SQL 会以 INFO 打到日志）
echo = false

# ========== SQLite配置 ==========
# SQLite数据库文件路径
sqlite_db_path = "data/sqlite.db"
# 是否显示SQL语句
sqlite_echo = false

# Neo4j 图数据库配置
[neo4j]
# uri 由环境变量 NEO4J_URI 提供（dev: bolt://localhost:7687 / prod: bolt://neo4j:7687）
# 连接池配置
max_connection_lifetime = 3600
max_connection_pool_size = 50
connection_acquisition_timeout = 60
# 数据库名称（企业版支持多数据库）
database = "neo4j"

# Redis 缓存配置
[redis]
# 模式选择：standalone（单机）或 cluster（集群）
mode = "standalone"

# host 由环境变量 REDIS_HOST 提供（dev: localhost / prod: services_redis）
port = 6379
# db 编号由环境变量 REDIS_DB 提供（dev: 3 / prod: 2；dev/prod 在同一 Redis 实例上按 db 隔离）
max_connections = 50        # 连接池最大连接数
socket_timeout = 5.0        # Socket 超时时间（秒）
socket_connect_timeout = 5.0  # Socket 连接超时时间（秒）
decode_responses = true     # 是否自动解码为字符串
encoding = "utf-8"          # 字符编码

# ==================== 对象存储配置 ====================

[storage]
# 存储类型: minio, oss, gcs, s3
type = "minio"

# MinIO 对象存储配置
[minio]
# endpoint 由环境变量 MINIO_ENDPOINT 提供（dev: localhost:9000 / prod: milvus-minio:9000）
# 默认桶名由环境变量 MINIO_BUCKET 提供（dev: dev-default / prod: default；桶名不允许下划线）
# 是否使用安全连接
secure = false
# 区域
region = "us-east-1"
# 上传分片大小（字节）
part_size = 10485760  # 10MB

# Kafka 消息队列配置
[kafka]
# ========== Broker配置 ==========
# bootstrap_servers 由环境变量 KAFKA_BOOTSTRAP_SERVERS 提供（逗号分隔，dev: localhost:9092 / prod: kafka:9092）
# 安全协议: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL
security_protocol = "PLAINTEXT"
# SASL机制: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
sasl_mechanism = "PLAIN"

# ========== Producer配置 ==========
[kafka.producer]
# 消息确认模式: 0(无确认), 1(leader确认), all(所有副本确认)
# 注意: 配置中使用 "all"，代码会自动转换为 -1（aiokafka 要求）
acks = "all"
# 批处理大小（字节，映射到 aiokafka 的 max_batch_size）
batch_size = 65536
# 批处理延迟时间（毫秒）
linger_ms = 5
# 压缩类型: none, gzip, snappy, lz4, zstd
compression_type = "lz4"
# 请求超时时间（毫秒）
request_timeout_ms = 30000
# 最大请求大小（字节）
max_request_size = 1048576  # 1MB

# ========== Consumer配置 ==========
[kafka.consumer]
# Consumer Group ID 前缀由环境变量 KAFKA_GROUP_ID_PREFIX 提供（dev: aks_dev / prod: aks）
# 实际使用时会加上组件名称
# 自动提交offset
enable_auto_commit = false
# 自动提交间隔（毫秒）
auto_commit_interval_ms = 5000
# 消费位置策略: earliest（从头开始）, latest（从最新开始）
auto_offset_reset = "earliest"
# 单次拉取最大记录数
max_poll_records = 500
# 单次拉取最小字节数（设为1：空闲时 broker 立即返回空结果，避免无谓等待）
fetch_min_bytes = 1
# 单次拉取最大等待时间（毫秒）
fetch_max_wait_ms = 500
# 请求超时时间（毫秒，必须 > session_timeout_ms，避免空闲时 RequestTimedOutError）
request_timeout_ms = 60000
# 请求失败后的退避时间（毫秒）
retry_backoff_ms = 500
# Session超时时间（毫秒）
session_timeout_ms = 30000
# 心跳间隔（毫秒）
heartbeat_interval_ms = 3000
# 最大拉取间隔（毫秒）
max_poll_interval_ms = 300000

# ========== Topic配置 ==========
[kafka.topics]
# Topic副本因子
replication_factor = 1
# 最小同步副本数
min_insync_replicas = 1
# 消息保留时间（毫秒）
retention_ms = 604800000  # 7天
# 消息保留大小（字节，-1表示无限制）
retention_bytes = -1
# 日志清理策略: delete, compact
cleanup_policy = "delete"

# ========== 前台阶段Topic分区数 ==========
# 高并发入口，需快速分发
index_start_partitions = 32
# 承接上游，保持一致
parse_end_partitions = 32
# 触发多个Consumer
split_end_partitions = 32

# ========== 后台阶段Topic分区数 ==========
# 后台任务，并行度要求较低
summary_end_partitions = 16
graph_end_partitions = 16
image_end_partitions = 16

# ========== 数据库写入Topic分区数 ==========
# 向量写入量最大，核心瓶颈
embedding_start_partitions = 32
# 图谱写入量中等
graph_start_partitions = 16
# 元数据写入频繁
meta_start_partitions = 32
# 文档写入量大
mongo_start_partitions = 32

# ========== 批处理配置 ==========
[kafka.batch]
# EmbeddingMilvusWriter批处理配置
embedding_batch_size = 100
embedding_flush_interval_ms = 500
embedding_api_batch_size = 64  # 单次Embedding API请求的batch size
milvus_insert_batch_size = 100

# Neo4jWriter批处理配置
neo4j_batch_size = 500
neo4j_flush_interval_ms = 2000

# MySQLWriter批处理配置
mysql_batch_size = 200
mysql_flush_interval_ms = 1000

# MongoWriter批处理配置
mongo_batch_size = 100
mongo_flush_interval_ms = 500

# ========== 重试和DLQ配置 ==========
[kafka.retry]
# 最大重试次数
max_retries = 3
# 重试延迟（秒）
retry_delays = [1, 5, 30]
# 是否启用DLQ（死信队列）
enable_dlq = true
# DLQ Topic后缀
dlq_suffix = ".dlq"
# 重试Topic后缀
retry_suffix = ".retry"

# ========== 幂等性配置 ==========
[kafka.idempotency]
# 是否启用幂等性检查
enable = true
# 去重缓存过期时间（秒）
dedup_cache_ttl = 86400  # 24小时
# 使用Redis作为去重缓存
use_redis = true

# ==================== 模型网关 ====================
# 类型 / 地址 / 密钥 / 客户端超时与重试全部来自 .env：
#   MODEL_GATEWAY_TYPE / MODEL_GATEWAY_TIMEOUT / MODEL_GATEWAY_MAX_RETRIES
#   MODEL_LAKE_* / AUTH_* / LITELLM_PROXY_*
# 不要在本文件写 gateway_type / api_base / timeout / retries。

# ==================== LLM 配置（公共说明） ====================
# 角色的 model / temperature / max_tokens / timeout / thinking_level
# 全部写在 config/profiles/<name>/models.toml 的 [presets.<role>]
# 档案跟随 .env 的 MODEL_GATEWAY_TYPE
# components.json 只写 llm_preset 角色名，不要写死模型或采样参数

[llm]
# 思考强度（pi 标准 7 档：off/minimal/low/medium/high/xhigh/max）统一语义：
#
#   1) 档案 ``[presets.<name>].thinking_level`` —— 某条后台调用路径默认的思考档位。
#      工厂 ``create_llm_client_from_preset`` 会经 ``LiteLLMRegistry.resolve_reasoning_effort``
#      把 pi 档位翻译成厂商原生 ``reasoning_effort``。
#
#   2) 业务请求 ``LLMClient.astream(reasoning_effort=...)``：None 沿用客户端默认。
#
#   3) Provider 差异交给 ThinkingAdapter / LiteLLM；不支持的参数由 drop_params 丢弃。

# ==================== Chat 模块配置 ====================
# 知识库对话服务（src/service/chat/chat_service.py）的运行参数
# - 通过 `ChatServiceConfig.from_config_manager()` 读取
# - LLM 选型引用角色名（fast/quality/...），具体模型与采样参数来自当前档案 models.toml
#   （components.json 仅服务于 RAG 抽取 Pipeline 的 Kafka Worker 组件）

[chat]
# 主对话 LLM 的 preset（ChatRequest / ChatSession 都未指定时用该默认）
# 如需细调 temperature / max_tokens / thinking_level，改当前档案 models.toml 的 [presets.<role>]
agent_model_preset = "fast"
# 异步起标题用的 preset（首轮结束后调用 1 次，性价比优先）
title_model_preset = "fast"
# 用户从前端 /api/chat/models 选了具体 model 时，作为采样参数模板的 preset
# （temperature / max_tokens / extra_params 取自该 preset，
#  model 字段被前端选定的字符串覆盖；思考强度由前端 thinking_level 逐轮传入）
user_chat_template_preset = "fast"
# read_image_chunks 工具内 VLM 的 preset（引用档案 [presets.multimodal]）
multimodal_model_preset = "multimodal"
# 会话默认交互模式（agent=工具循环 / plan=先规划再执行）
default_mode = "agent"
# 新建会话默认思考强度档位（pi 标准 7 档之一）；仅 reasoning 类模型生效，
# 后端会按模型 thinking_levels 钳位。前端不传时用该默认。
default_thinking_level = "off"
# Agent 模式默认工具批次上限
default_max_tool_rounds = 5
# @ 内联引用（方案A）：单个 @ 文件全量注入正文的字符上限；超过则退化为方案C（仅提示 document_id）
mention_inject_max_chars = 6000
# @ 内联引用（方案A）：单轮所有 @ 文件全量注入正文的合计字符预算；超预算的文件退化为方案C
mention_inject_total_budget = 12000
# 单轮 assistant 输出 token 上限；0 / 缺省表示由模型 / preset 决定
max_completion_tokens = 0

[chat.retrieval]
# 服务端初始检索 top_k
top_k = 8

[chat.history]
# 全量加载历史消息的防御性上限（条数）；正常会话远不会触及
max_messages = 100000
# 上下文窗口 token 预算兜底（仅在模型解析不出 max_context 时用于尾部滑窗）；
# 参与预算的统一上限见 [chat.context] max_context_cap
max_tokens = 200000
# 用量占软上限（有效窗口 - 输出预留）超过该比例时触发持久化摘要压缩（Cursor 式）
summary_compress_threshold_ratio = 0.9
# 摘要压缩后保留的最近轮数（1 轮 = 一次用户交互，含其完整工具链）
summary_keep_recent_turns = 1

[chat.context]
# 统一上下文上限（Cursor 式）：有效窗口 = min(模型声明窗口, 本值)
#   - 声明值更大的模型（如 1M 的 deepseek-v4 / qwen3.7）按本值封顶
#   - 声明值更小的模型（如 128K）按其自身窗口计量，不会被抬高到本值
# 设为 0 则完全按模型各自声明值，不封顶
max_context_cap = 200000
# 输出预留兜底（preset / catalog 都未声明 max_tokens/max_output 时使用）
reserved_output_fallback = 8192
# 单条工具结果硬顶（tokens）；超出则截断头尾保留
tool_output_hard_cap_tokens = 32000
# 工具循环内每次 LLM 调用前重做预算检查（超出则由旧到新收缩工具结果）
tool_loop_budget_check = true
# 收缩时单条工具结果保留的下限（tokens）；仍超则整条省略
tool_output_floor_tokens = 512
# 分层摘要 map 块预算（tokens）
summary_chunk_tokens = 24000
# reduce 后摘要目标长度（tokens）
summary_target_tokens = 1500
# map 阶段并发度
summary_map_concurrency = 4
# context-status API 进程内缓存秒数
context_status_cache_seconds = 15
# heuristic token 估算安全系数（tokenizer 不可用时乘以该系数，宁早勿晚）
heuristic_safety_factor = 1.2

# ==================== Embedding 配置（LiteLLM 统一接入） ====================
# - 业务约束（dimension/batch_size/max_concurrent）在 [embedding] 节
# - 模型路由（model 字符串）在 [embedding.presets.*] 节，可被 components.json 引用
# - api_base / api_key 来自 .env（LITELLM_PROXY_*），可在 preset 中覆盖

[embedding]
# 默认 preset 名称（components 未声明 embedding/embedding_preset 时使用）
default_preset = "local_dense"
# 稠密向量维度（业务约束，必须与 [milvus].vector_dim 一致；模型返回不一致时报错）
dimension = 1024
# 单批次发往 Embedding 服务的文本数量
batch_size = 64
# aembed_concurrent 的最大并发请求数
max_concurrent = 5
# 请求超时（秒），preset 未指定时使用此值
timeout = 60.0

[embedding.presets.local_dense]
# 通过 LiteLLM Proxy 调用本地 qwen3-embedding-0.6b（OpenAI 兼容 /embeddings）
model = "openai/qwen3-embedding-0.6b"
# 可选：dimension / batch_size / timeout / api_base / api_key / extra_params

# 示例：未来想用 OpenAI text-embedding-3-large
# [embedding.presets.openai_large]
# model = "openai/text-embedding-3-large"
# dimension = 3072

# ==================== Sparse Embedding 配置（BGE-M3，独立实现） ====================
# 注：LiteLLM 暂不支持 BGE-M3 sparse 输出，保留独立 httpx 实现。

[sparse_embedding]
# BGE-M3 稀疏向量服务 API 地址（api_base 由环境变量 SPARSE_EMBEDDING_API_BASE 提供，如 http://localhost:18085/v1）
# 模型名称
model_name = "bge-m3"
# 批处理大小
batch_size = 64
# 请求超时时间（秒，必填）
timeout = 60.0
# 是否启用重试机制
enable_retry = true
# 最大重试次数
max_retries = 3
# 重试延迟时间（秒）
retry_delay = 0.5
# 重试策略: fixed, exponential, linear
retry_strategy = "exponential"
# 最大重试延迟上限（秒）
max_retry_delay = 10.0

# ==================== Reranker 配置（LiteLLM 统一接入） ====================
# - LiteLLM 走 cohere /rerank 协议；vLLM 部署的 Qwen3-reranker 完全兼容该格式
# - 业务约束（batch_size/top_k）在 [reranker] 节，模型路由在 [reranker.presets.*]

[reranker]
# 默认 preset 名称
default_preset = "local_rerank"
# 单批次发往 Reranker 的文档数量
batch_size = 16
# 默认返回 Top-K 数量
top_k = 10
# 请求超时（秒）
timeout = 30.0

[reranker.presets.local_rerank]
# 通过 LiteLLM Proxy 调用本地 qwen3-reranker-0.6b（cohere /rerank 格式）
model = "cohere/qwen3-reranker-0.6b"
# 可选：top_k / batch_size / timeout / api_base / api_key / extra_params

# ==================== 第三方服务配置 ====================

# MinerU 服务配置（PDF解析）
[mineru]
# API 服务地址（api_url 由环境变量 MINERU_API_URL 提供，如 http://192.168.19.232:18000）
# 超时时间（秒）
timeout = 300

# ==================== 系统配置 ====================

# 日志配置
[logging]
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# 日志文件路径
log_dir = "logs"
# 日志文件名
log_file = "dev.log"
# 日志格式
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
# 单个日志文件最大大小（MB）
max_bytes = 100
# 保留的日志文件数量
backup_count = 10

# 文件处理配置
[file_upload]
# 支持的文件类型
supported_formats = ["pdf", "docx", "pptx", "xlsx", "txt", "md", "markdown", "json", "csv", "doc", "xls", "ppt", "png", "jpg", "jpeg", "gif", "webp", "svg", "bmp"]
# 最大文件大小（MB）
max_file_size = 100
# 文件上传临时目录
temp_dir = "upload"
