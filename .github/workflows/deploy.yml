name: Deploy AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - name: Deploy AKS
        run: |
          set -e
          cd ${{ secrets.DEPLOY_PATH }}/folio-aks-server
          # 部署目录镜像远端：fetch+checkout+reset 硬对齐，防本地 commit/落错分支
          # 引发的 pull 分叉 fatal，且能自愈 checkout 分支错位（.env untracked 不受影响）
          git fetch origin
          git checkout main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
          echo "✅ AKS deployed at $(date)"
